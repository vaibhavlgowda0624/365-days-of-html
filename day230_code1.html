<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Expense Dashboard</title>
</head>
<body>
  <header>
    <h1>My Expense Dashboard</h1>
  </header>

  <main>
    <section>
      <h2>Monthly Summary</h2>
      <p>Total Spending: ₹7,000</p>
      <p>Monthly Budget: ₹10,000</p>
      <progress value="7000" max="10000"></progress>
    </section>

    <section>
      <h2>Recent Transactions</h2>
      <ul>
        <li>Food: ₹2,500</li>
        <li>Travel: ₹1,200</li>
        <li>Shopping: ₹1,800</li>
      </ul>
    </section>
  </main>
</body>
</html>
