<form>
  <h2>Submit Background Job</h2>

  <label for="job">Job Name:</label>
  <input id="job" type="text" required>

  <label for="priority">Priority:</label>
  <select id="priority">
    <option>Low</option>
    <option>Medium</option>
    <option>High</option>
  </select>

  <button type="submit">Submit Job</button>
</form>
