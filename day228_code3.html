<form>
  <h1>Tech Event Registration</h1>

  <label for="participant">Participant Name:</label>
  <input id="participant" type="text" required>

  <label for="event">Choose Event:</label>
  <select id="event">
    <option>Hackathon</option>
    <option>Cybersecurity Workshop</option>
    <option>Web Development Seminar</option>
  </select>

  <label for="attendance">Attendance Date:</label>
  <input id="attendance" type="date">

  <button type="submit">Join Event</button>
</form>
