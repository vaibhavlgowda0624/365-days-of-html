<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Learning Tracker</title>
</head>
<body>
    <h1>Learning Tracker</h1>

    <section>
        <h2>Python</h2>
        <label for="python-progress">Learning progress:</label>
        <progress id="python-progress" value="60" max="100">
            60%
        </progress>
    </section>

    <section>
        <h2>HTML</h2>
        <label for="html-progress">Learning progress:</label>
        <progress id="html-progress" value="75" max="100">
            75%
        </progress>
    </section>

    <section>
        <h2>Today's Target</h2>
        <label>
            <input type="checkbox">
            Practise Python
        </label>
        <br>

        <label>
            <input type="checkbox">
            Build an HTML page
        </label>
        <br>

        <label>
            <input type="checkbox">
            Push code to GitHub
        </label>
    </section>

    <p>Progress values are sample values and do not update automatically.</p>
</body>
</html>
