  <h1>Algorithm Explorer</h1>
  <section>
    <h2>Binary Search</h2>
    <p>Searches a sorted collection by repeatedly halving the range.</p>
    <p><strong>Time complexity:</strong> O(log n)</p>
  </section>
  <section>
    <h2>Merge Sort</h2>
    <p>Divides data into smaller parts and merges sorted results.</p>
    <p><strong>Time complexity:</strong> O(n log n)</p>
  </section>
</main>
