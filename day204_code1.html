<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>API Documentation</title>
</head>
<body>
    <h1>Student API</h1>
    <p>An example API for retrieving student records.</p>

    <h2>Endpoint</h2>
    <code>GET /api/students</code>

    <h2>Example Response</h2>
    <pre>
{
    "id": 101,
    "name": "Asha",
    "course": "MCA"
}
    </pre>

    <h2>Status Codes</h2>
    <ul>
        <li>200 — Success</li>
        <li>400 — Invalid request</li>
        <li>404 — Resource not found</li>
        <li>500 — Server error</li>
    </ul>
</body>
</html>
