<form>
  <h2>Search Student</h2>

  <label for="student">Student Name:</label>
  <input id="student" type="search" placeholder="Enter name">

  <label for="grade">Grade:</label>
  <select id="grade">
    <option>All</option>
    <option>A</option>
    <option>B</option>
    <option>C</option>
  </select>

  <button type="submit">Search</button>
</form>
