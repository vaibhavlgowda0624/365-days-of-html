<form>
  <h2>Security Audit</h2>

  <label for="system">System Name:</label>
  <input id="system" type="text" required>

  <label for="audit">Audit Type:</label>
  <select id="audit">
    <option>Access Control</option>
    <option>File Integrity</option>
    <option>Login Monitoring</option>
  </select>

  <label for="findings">Findings:</label>
  <textarea id="findings"></textarea>

  <button type="submit">Save Audit</button>
</form>
