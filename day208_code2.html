<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Coding Challenge</title>
</head>
<body>
    <h1>Submit Your Solution</h1>

    <form>
        <label for="problem">Problem:</label>
        <select id="problem" name="problem">
            <option value="search">Binary Search</option>
            <option value="sort">Merge Sort</option>
            <option value="pair">Pair Sum</option>
        </select>
        <br><br>

        <label for="language">Language:</label>
        <select id="language" name="language">
            <option value="python">Python</option>
            <option value="java">Java</option>
            <option value="cpp">C++</option>
        </select>
        <br><br>

        <label for="solution">Solution Code:</label><br>
        <textarea id="solution" name="solution"
                  rows="12" cols="60" required></textarea>
        <br><br>

        <button type="submit">Submit Solution</button>
    </form>
</body>
</html>
