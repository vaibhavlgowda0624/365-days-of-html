<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Monthly Report</title>
</head>
<body>
    <h1>Monthly Sales Report</h1>

    <table border="1">
        <caption>Sales for October</caption>
        <thead>
            <tr>
                <th scope="col">Month</th>
                <th scope="col">Orders</th>
                <th scope="col">Revenue</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="row">Week 1</th>
                <td>120</td>
                <td>₹24,000</td>
            </tr>
            <tr>
                <th scope="row">Week 2</th>
                <td>150</td>
                <td>₹30,000</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
