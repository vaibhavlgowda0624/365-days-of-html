<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Algorithms</title>
</head>
<body>
    <h1>Algorithm Learning</h1>

    <article>
        <h2>Linear Search</h2>
        <p>Checks elements one by one.</p>
        <p>Time complexity: O(n)</p>
    </article>

    <article>
        <h2>Binary Search</h2>
        <p>Repeatedly halves a sorted search range.</p>
        <p>Time complexity: O(log n)</p>
    </article>

    <article>
        <h2>Merge Sort</h2>
        <p>Divides data into smaller parts and merges sorted results.</p>
        <p>Time complexity: O(n log n)</p>
    </article>
</body>
</html>
