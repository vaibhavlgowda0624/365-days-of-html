<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SQL Reference</title>
</head>
<body>
    <h1>Basic SQL Commands</h1>

    <h2>Select Records</h2>
    <pre><code>SELECT * FROM students;</code></pre>

    <h2>Filter Records</h2>
    <pre><code>SELECT * FROM students
WHERE course = 'MCA';</code></pre>

    <h2>Sort Records</h2>
    <pre><code>SELECT * FROM students
ORDER BY name ASC;</code></pre>
</body>
</html>
