<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Semantic Layout</title>
</head>
<body>
    <header>
        <h1>Tech World</h1>
    </header>

    <nav aria-label="Main navigation">
        <a href="#home">Home</a>
        <a href="#articles">Articles</a>
        <a href="#contact">Contact</a>
    </nav>

    <main id="home">
        <section id="articles">
            <h2>Latest Articles</h2>
            <article>
                <h3>Learning Python</h3>
                <p>Start with variables, loops and functions.</p>
            </article>
        </section>

        <aside>
            <h2>Recommended</h2>
            <p>Explore programming tutorials.</p>
        </aside>
    </main>

    <footer id="contact">
        <p>Contact: hello@example.com</p>
    </footer>
</body>
</html>
